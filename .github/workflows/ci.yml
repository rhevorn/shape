name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: tools/shapevet/go.sum
      - run: make check
      - run: make shapevet-test
      - run: make shapevet-isolated
      - run: make shapevet-check
      - run: make test-race

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: tools/shapevet/go.sum
      - run: make fuzz-smoke
